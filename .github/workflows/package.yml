name: Package

# Nhóm KHÔNG deploy - workflow này chỉ đóng gói app thành một thư mục zip
# chạy được, để nộp bài hoặc gửi cho người khác dùng thử.
#
# Cách chạy:
#   - Thủ công: tab Actions -> Package -> Run workflow
#   - Tự động : đẩy tag dạng v1.0.0 lên repo (git tag v1.0.0 && git push --tags)
on:
  workflow_dispatch:
    inputs:
      self_contained:
        description: 'Kèm sẵn .NET runtime (người dùng không cần cài .NET 8)'
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Đóng gói ứng dụng
    runs-on: windows-latest
    timeout-minutes: 25

    permissions:
      contents: write   # cần để tạo Release khi đẩy tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Xác định thông tin bản dựng
        id: info
        shell: pwsh
        run: |
          # Đẩy tag v1.2.3 thì lấy 1.2.3 làm số hiệu bản dựng; chạy tay thì
          # dùng số thứ tự lượt chạy để mỗi gói có một tên khác nhau.
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
              $version = "0.1.0-build.${{ github.run_number }}"
          }

          # push tag không có input nên mặc định là self-contained
          $sc = '${{ github.event.inputs.self_contained }}'
          if ([string]::IsNullOrEmpty($sc)) { $sc = 'true' }

          "version=$version"       | Out-File $env:GITHUB_OUTPUT -Append
          "selfContained=$sc"      | Out-File $env:GITHUB_OUTPUT -Append
          "packageName=SAT-v$version-win-x64" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version = $version, self-contained = $sc"

      - name: Restore
        run: dotnet restore FAT.sln

      - name: Build & Test
        # Không đóng gói code chưa chạy được test.
        run: |
          dotnet build FAT.sln --configuration Release --no-restore
          dotnet test FAT.sln --configuration Release --no-build

      - name: Publish
        shell: pwsh
        run: |
          # KHÔNG dùng PublishSingleFile: WPF + SkiaSharp (LiveCharts2) có thư
          # viện native, gói vào một file exe rồi tự giải nén ra thư mục tạm khi
          # chạy - vừa chậm khi khởi động vừa hay bị phần mềm diệt virus chặn.
          # Xuất ra một thư mục rồi zip lại thì chắc chắn chạy được hơn.
          dotnet publish src/SAT.App/SAT.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained ${{ steps.info.outputs.selfContained }} `
            --output publish/app `
            -p:Version=${{ steps.info.outputs.version }} `
            -p:DebugType=none `
            -p:PublishReadyToRun=true

      - name: Kèm script dựng database và hướng dẫn
        shell: pwsh
        run: |
          # Gói app mà thiếu script tạo DB thì người nhận không chạy được:
          # app cần sẵn database SAT mới đăng nhập được.
          New-Item -ItemType Directory -Force -Path publish/app/db | Out-Null
          Copy-Item db/*.sql, db/setup-db.ps1 -Destination publish/app/db/

          # KHONG dung here-string @"..."@ o day: PowerShell bat buoc dau dong
          # phai nam o cot 0, ma trong YAML moi dong deu bi thut le => loi parse.
          # Dung mang chuoi roi noi lai bang xuong dong.
          $runtimeNote = if ('${{ steps.info.outputs.selfContained }}' -eq 'false') {
              '- .NET 8 Desktop Runtime: https://dotnet.microsoft.com/download/dotnet/8.0'
          } else {
              '- KHONG can cai .NET: runtime da duoc dong goi san.'
          }

          $lines = @(
              'SAT - Student Academic Tracker',
              '==============================',
              'Phien ban: ${{ steps.info.outputs.version }}',
              '',
              'YEU CAU',
              '-------',
              '- Windows 10 phien ban 2004 tro len',
              '- SQL Server (ban Express mien phi la du)',
              $runtimeNote,
              '',
              'CACH CHAY',
              '---------',
              '1. Mo PowerShell tai thu muc nay va chay:',
              '       .\db\setup-db.ps1',
              '   (Neu SQL Server khong phai instance mac dinh:',
              '       .\db\setup-db.ps1 -Server ".\SQLEXPRESS")',
              '',
              '2. Chay SAT.App.exe',
              '',
              '3. Dang nhap bang mot trong cac tai khoan:',
              '       admin      / Admin@123',
              '       student01  / Student@123',
              '       student02  / Student@123',
              '       student03  / Student@123',
              '',
              'KET NOI DATABASE',
              '----------------',
              "Mac dinh app noi toi 'localhost'. Neu SQL Server cua ban o instance",
              'khac, sua chuoi ket noi trong appsettings.json canh SAT.App.exe.',
              '',
              'CANH BAO',
              '--------',
              'setup-db.ps1 se XOA VA TAO LAI database SAT.',
              'Moi du lieu ban tu nhap se mat.'
          )

          $lines -join "`r`n" | Out-File -FilePath publish/app/README.txt -Encoding utf8

      - name: Nén thành gói
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/out | Out-Null
          Compress-Archive -Path publish/app/* `
                           -DestinationPath "publish/out/${{ steps.info.outputs.packageName }}.zip" `
                           -CompressionLevel Optimal
          $zip = Get-Item "publish/out/${{ steps.info.outputs.packageName }}.zip"
          Write-Host "Kich thuoc goi: $([math]::Round($zip.Length / 1MB, 1)) MB"

      # Kiểm tra gói thật sự chạy được, thay vì chỉ tin là nó chạy được.
      # Không có bước này thì lỗi thiếu dll chỉ lộ ra khi người nhận mở app.
      - name: Kiểm tra gói khởi động được
        shell: pwsh
        run: |
          $exe = "publish/app/SAT.App.exe"
          if (-not (Test-Path $exe)) {
              Write-Host "::error::Khong tim thay SAT.App.exe trong goi."
              exit 1
          }

          # App khong co database nen se hien hop thoai loi roi thoat - dieu
          # can kiem tra o day la no NAP DUOC assembly, khong phai no chay tron.
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8

          if ($p.HasExited -and $p.ExitCode -ne 0) {
              Write-Host "::error::App thoat ngay voi ma loi $($p.ExitCode) - goi bi hong."
              exit 1
          }

          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "Goi khoi dong duoc."

      - name: Tải gói lên Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.info.outputs.packageName }}
          path: publish/out/*.zip
          retention-days: 90

      - name: Tạo Release (chỉ khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/out/*.zip
          generate_release_notes: true
