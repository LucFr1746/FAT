name: Package

# The team does not deploy - this workflow only packages the app into a single
# runnable zip, for submission or for handing to someone to try out.
#
# How to run it:
#   - Manually:    Actions tab -> Package -> Run workflow
#   - Automatically: push a tag such as v1.0.0 (git tag v1.0.0 && git push --tags)
on:
  workflow_dispatch:
    inputs:
      self_contained:
        description: 'Bundle the .NET runtime (users will not need to install .NET 8)'
        type: boolean
        default: true
  push:
    tags: ['v*']

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: Package the application
    runs-on: windows-latest
    timeout-minutes: 25

    permissions:
      contents: write   # needed to create a Release when a tag is pushed

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine build information
        id: info
        shell: pwsh
        run: |
          # A tag v1.2.3 becomes version 1.2.3; a manual run uses the run number
          # so that each package gets a distinct name.
          if ('${{ github.ref }}' -like 'refs/tags/v*') {
              $version = '${{ github.ref_name }}'.TrimStart('v')
          } else {
              $version = "0.1.0-build.${{ github.run_number }}"
          }

          # A tag push carries no inputs, so default to self-contained.
          $sc = '${{ github.event.inputs.self_contained }}'
          if ([string]::IsNullOrEmpty($sc)) { $sc = 'true' }

          "version=$version"                  | Out-File $env:GITHUB_OUTPUT -Append
          "selfContained=$sc"                 | Out-File $env:GITHUB_OUTPUT -Append
          "packageName=FAT-v$version-win-x64" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "Version = $version, self-contained = $sc"

      - name: Restore
        run: dotnet restore FAT.sln

      - name: Build & Test
        # Never package code that has not passed its tests.
        run: |
          dotnet build FAT.sln --configuration Release --no-restore
          dotnet test FAT.sln --configuration Release --no-build

      - name: Publish
        shell: pwsh
        run: |
          # PublishSingleFile is deliberately NOT used: WPF plus SkiaSharp
          # (LiveCharts2) carries native libraries, so a single-file build
          # extracts itself into a temp folder on every launch - slow to start
          # and frequently flagged by antivirus. A plain folder, zipped, is far
          # more reliable.
          dotnet publish src/FAT.App/FAT.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained ${{ steps.info.outputs.selfContained }} `
            --output publish/app `
            -p:Version=${{ steps.info.outputs.version }} `
            -p:DebugType=none `
            -p:PublishReadyToRun=true

      - name: Include the database scripts and a readme
        shell: pwsh
        run: |
          # A package without the database scripts is useless to the recipient:
          # the app needs the FAT database to exist before anyone can sign in.
          New-Item -ItemType Directory -Force -Path publish/app/db | Out-Null
          Copy-Item db/*.sql, db/setup-db.ps1 -Destination publish/app/db/

          # Do NOT use a here-string @"..."@ here: PowerShell requires the
          # closing delimiter at column 0, but every line inside a YAML block is
          # indented, which is a parse error. Build an array and join instead.
          $runtimeNote = if ('${{ steps.info.outputs.selfContained }}' -eq 'false') {
              '- .NET 8 Desktop Runtime: https://dotnet.microsoft.com/download/dotnet/8.0'
          } else {
              '- No .NET installation required: the runtime is bundled.'
          }

          $lines = @(
              'FAT - FPT Academic Tracker',
              '==========================',
              'Version: ${{ steps.info.outputs.version }}',
              '',
              'REQUIREMENTS',
              '------------',
              '- Windows 10 version 2004 or later',
              '- SQL Server (the free Express edition is enough)',
              $runtimeNote,
              '',
              'HOW TO RUN',
              '----------',
              '1. Open PowerShell in this folder and run:',
              '       .\db\setup-db.ps1',
              '   (If your SQL Server is not the default instance:',
              '       .\db\setup-db.ps1 -Server ".\SQLEXPRESS")',
              '',
              '2. Start FAT.App.exe',
              '',
              '3. Sign in with one of these accounts:',
              '       admin      / Admin@123',
              '       student01  / Student@123',
              '       student02  / Student@123',
              '       student03  / Student@123',
              '',
              'DATABASE CONNECTION',
              '-------------------',
              "The app connects to 'localhost' by default. If your SQL Server is",
              'elsewhere, edit the connection string in appsettings.json next to',
              'FAT.App.exe.',
              '',
              'WARNING',
              '-------',
              'setup-db.ps1 DROPS AND RECREATES the FAT database.',
              'Any data you entered will be lost.'
          )

          $lines -join "`r`n" | Out-File -FilePath publish/app/README.txt -Encoding utf8

      - name: Create the zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/out | Out-Null
          Compress-Archive -Path publish/app/* `
                           -DestinationPath "publish/out/${{ steps.info.outputs.packageName }}.zip" `
                           -CompressionLevel Optimal
          $zip = Get-Item "publish/out/${{ steps.info.outputs.packageName }}.zip"
          Write-Host "Package size: $([math]::Round($zip.Length / 1MB, 1)) MB"

      # Prove the package actually runs instead of assuming it does. Without
      # this step a missing DLL only shows up when the recipient opens the app.
      - name: Smoke-test the package
        shell: pwsh
        run: |
          $exe = "publish/app/FAT.App.exe"
          if (-not (Test-Path $exe)) {
              Write-Host "::error::FAT.App.exe is missing from the package."
              exit 1
          }

          # There is no database here, so the app shows an error dialog and
          # exits. What this checks is that it LOADS its assemblies at all -
          # not that it runs end to end.
          $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8

          if ($p.HasExited -and $p.ExitCode -ne 0) {
              Write-Host "::error::The app exited immediately with code $($p.ExitCode) - the package is broken."
              exit 1
          }

          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          Write-Host "The package starts correctly."

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.info.outputs.packageName }}
          path: publish/out/*.zip
          retention-days: 90

      - name: Create a Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: publish/out/*.zip
          generate_release_notes: true
