name: CI

# Runs on EVERY branch: pushing to your own branch tells you immediately whether
# your code still builds, instead of finding out when you open the pull request.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# A new commit on the same branch cancels the previous run - saves CI minutes
# and avoids waiting on results for code that is already out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & Test
    # Windows is MANDATORY: FAT.App is WPF (net8.0-windows), which cannot be
    # built on Linux.
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Read the version from global.json so CI uses exactly the SDK the
          # team uses. Hard-coding it here guarantees it drifts out of sync
          # eventually, and nobody notices.
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore FAT.sln

      - name: Build
        run: dotnet build FAT.sln --configuration Release --no-restore

      # Integration tests need SQL Server. GitHub's Windows runners do not have
      # one, so those tests SKIP themselves (see SkippableFact in
      # DatabaseSchemaTests). The unit tests covering the grading rules - the
      # part that actually goes wrong - still run in full.
      - name: Test
        run: >
          dotnet test FAT.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        # Run even when tests fail - that is precisely when the results matter.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults
          retention-days: 14

  format:
    name: Code Format
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore FAT.sln

      # Blocks purely cosmetic diffs at the pull request. Without this step a PR
      # mixes real changes with whatever the author's IDE reformatted, which
      # makes the reviewer's job much harder.
      - name: Verify formatting
        run: dotnet format FAT.sln --verify-no-changes --verbosity diagnostic

      - name: How to fix a formatting failure
        if: failure()
        run: |
          Write-Host "::error::Code does not match the agreed formatting."
          Write-Host "Run this locally and commit the result:"
          Write-Host "    dotnet format FAT.sln"
        shell: pwsh

  database:
    name: Database Scripts
    # Ubuntu, NOT windows-latest: the SQL Server image is a Linux container and
    # GitHub's Windows runners can only run Windows containers.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Stand up a real SQL Server and run the scripts from scratch. The point is
    # to catch T-SQL syntax and constraint errors AS SOON AS someone changes the
    # schema, rather than when the whole team runs setup-db.ps1 locally. Since
    # the project does not use EF Migrations, this is the only safety net for
    # schema changes.
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong@Passw0rd'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong@Passw0rd -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Use the sqlcmd ALREADY INSIDE the SQL Server image rather than
      # installing tooling on the runner. One less network download to break,
      # and the sqlcmd version always matches the server version.
      - name: Run database scripts
        run: |
          set -euo pipefail
          CID='${{ job.services.mssql.id }}'
          docker cp db/. "$CID:/tmp/db/"

          run_scripts() {
            for f in 01_schema.sql 02_seed_master.sql 03_seed_demo.sql; do
              echo "--> $f"
              docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd \
                -S localhost -U sa -P 'YourStrong@Passw0rd' -C -b -i "/tmp/db/$f"
            done
          }

          echo "=== Pass 1: build from scratch ==="
          run_scripts

          # A second pass proves the scripts are idempotent: rebuilding any
          # number of times must succeed, never fail on a duplicate key.
          echo "=== Pass 2: idempotency check ==="
          run_scripts

      - name: Verify the seeded data
        run: |
          set -euo pipefail
          CID='${{ job.services.mssql.id }}'
          docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd \
            -S localhost -U sa -P 'YourStrong@Passw0rd' -C -b -d FAT -h -1 -W \
            -Q "SET NOCOUNT ON;
                DECLARE @c INT = (SELECT COUNT(*) FROM dbo.Course);
                DECLARE @s INT = (SELECT COUNT(*) FROM dbo.Student);
                DECLARE @m INT = (SELECT COUNT(*) FROM dbo.Material);
                IF @c <> 31 OR @s <> 3 OR @m <> 8
                    THROW 51000, N'Seed data row counts are not what was expected.', 1;
                PRINT CONCAT('OK: ', @c, ' courses, ', @s, ' students, ', @m, ' materials.');"

      - name: Dump SQL Server logs on failure
        if: failure()
        run: docker logs '${{ job.services.mssql.id }}'
